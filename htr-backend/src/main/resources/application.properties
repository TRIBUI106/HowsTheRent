spring.application.name=htr-backend
spring.config.import=optional:file:../.env[.properties]

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/htr}
spring.datasource.username=${DB_USER:htr}
spring.datasource.password=${DB_PASSWORD:secret}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Multipart uploads
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=100MB

# JWT
jwt.secret=${JWT_SECRET:changeThisToASecureRandomStringAtLeast256BitsLong!!}
jwt.access-token-expiration=1800000
jwt.refresh-token-expiration=2592000000

# App / Frontend
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
app.cookie.secure=${COOKIE_SECURE:false}
app.cookie.same-site=${COOKIE_SAME_SITE:Lax}

# Auth
app.otp.ttl-minutes=${OTP_TTL_MINUTES:10}

# Mail
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Object Storage (MinIO locally, Cloudflare R2 in production)
minio.url=${MINIO_URL:http://localhost:9000}
minio.public-url=${MINIO_PUBLIC_URL:${minio.url}/${minio.bucket}}
minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
minio.bucket=${MINIO_BUCKET:htr}
minio.auto-create-bucket=${MINIO_AUTO_CREATE_BUCKET:true}
minio.region=${MINIO_REGION:auto}

# PayOS
payos.client-id=${PAYOS_CLIENT_ID:}
payos.api-key=${PAYOS_API_KEY:}
payos.checksum-key=${PAYOS_CHECKSUM_KEY:}
payos.return-url=${PAYOS_RETURN_URL:http://localhost:5173/payment/success}
payos.cancel-url=${PAYOS_CANCEL_URL:http://localhost:5173/payment/cancel}

# Quartz
spring.quartz.job-store-type=memory
spring.quartz.properties.org.quartz.threadPool.threadCount=3

# Async
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=10
spring.task.execution.thread-name-prefix=async-
server.port=${PORT:${SERVER_PORT:8080}}
