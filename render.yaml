services:
  - type: web
    name: hows-the-rent-api
    runtime: docker
    plan: free
    rootDir: htr-backend
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://hows-the-rent.vercel.app
      - key: COOKIE_SECURE
        value: true
      - key: COOKIE_SAME_SITE
        value: Lax
      - key: PAYOS_CLIENT_ID
        sync: false
      - key: PAYOS_API_KEY
        sync: false
      - key: PAYOS_CHECKSUM_KEY
        sync: false
      - key: PAYOS_RETURN_URL
        value: https://hows-the-rent.vercel.app/payment/success
      - key: PAYOS_CANCEL_URL
        value: https://hows-the-rent.vercel.app/payment/cancel
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MINIO_URL
        sync: false
      - key: MINIO_PUBLIC_URL
        sync: false
      - key: MINIO_ACCESS_KEY
        sync: false
      - key: MINIO_SECRET_KEY
        sync: false
      - key: MINIO_BUCKET
        value: htr
      - key: MINIO_AUTO_CREATE_BUCKET
        value: false
